[package]
name = "taskmgr"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "bb0323cef6c7b144eeea5ad1670ccf7a3fbde253"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "3fc33496121382cc31a53a8c3178e0f2c90977fb"

[dependencies.data_views]
git = "https://git.waozi.xyz/kryonlabs/data-views.git"
ref = "bd6192e7d855d56d6527b740397c340d29b29e57"

[exports]
model = "src/model.zi"
service = "src/service.zi"

[install]
bin = "taskmgr"

# `kryon run` opens the default profile; `kryon run shot > screen.ppm` renders
# one frame without a display.
[tool.kryon]
default_profile = "desktop"
entry = "src/app.zi"

[tool.kryon.profiles.desktop]
backend = "desktop"
host = "src/desktop_host.zi"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.tui]
backend = "terminal"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.profiles.shot]
backend = "pixmap"

[tool.kryon.install]
profile = "desktop"
name = "Task Manager"
icon = "assets/taskmgr.svg"
comment = "Kryon process monitor"
categories = "Utility;System;"
